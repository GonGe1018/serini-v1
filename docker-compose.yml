services:
  mysql:
    image: mysql:8.0
    container_name: serini-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: serini-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  admin:
    build: ./admin
    container_name: serini-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-3000}:80"
    depends_on:
      - backend

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: serini-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  mysql_data:
